<!DOCTYPE html>
< lang="en">
<head>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkareem</title>

    <style>
        body {
            margin: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #quran {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .surah img {
            width: 90%;
            max-width: 600px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div id="quran"></div>

    <script>
        for (let i = 1; i <= 604; i++) {
            let page = i;
            document.getElementById("quran").innerHTML += `
                <div class="surah">
                    <img src="${page}.png" alt="Quran Page">
                </div>
            `;
        }
    </script>

</body>
</html>
